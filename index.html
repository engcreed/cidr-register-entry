<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>CIDR 관리대장</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f7f8; color: #233b50; font: 16px/1.65 system-ui, sans-serif; }
    main { width: min(34rem, calc(100% - 5rem)); margin: 1.5rem; padding: 2rem; border-radius: 16px; background: white; box-shadow: 0 10px 40px #233b5010; }
    h1 { margin-top: 0; font-size: 1.9rem; }
    p { margin-bottom: 1.5rem; }
    button { border: 0; border-radius: 8px; padding: 1rem 1.5rem; background: #167b78; color: white; font: inherit; font-weight: 600; cursor: pointer; }
    button:hover { background: #116360; }
    button:focus-visible { outline: 3px solid #233b50; outline-offset: 4px; }
    small { display: block; margin-top: 1.5rem; color: #596b78; }
  </style>
</head>
<body>
  <main>
    <h1>CIDR 관리대장</h1>
    <p>현행 주소 공간과 계획안을 확인하고, 추가 CIDR를 시뮬레이션합니다.</p>
    <form action="https://script.google.com/macros/s/AKfycbySnTGJ_KQ_MaqDKqRbleZgJoCkiqbMlZgZahAoF2XuSDqdnuURhtMBK2h20W60sEin/exec" method="post">
      <button type="submit">관리대장 열기</button>
    </form>
    <small>등록된 Google 계정으로 로그인하세요. 변경 요청과 PM 검토는 관리대장 안에서 진행합니다.</small>
  </main>
</body>
</html>
